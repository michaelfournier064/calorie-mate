version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: caloriemate_root
      MYSQL_DATABASE: caloriemate
      MYSQL_USER: caloriemate_user
      MYSQL_PASSWORD: caloriemate_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcaloriemate_root"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  # CalorieMate Flask Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .docker.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # phpMyAdmin for database management (optional)
  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: caloriemate_user
      PMA_PASSWORD: caloriemate_pass
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  mysql_data:

